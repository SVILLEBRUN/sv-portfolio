services:
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: 'production-stage'
    container_name: sv-portfolio
    restart: always
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - PORT=8081
      - HOST=0.0.0.0
    env_file:
      - .env