projects:
  title: Mes projets
  modal_title: Détails du projet 
  items:
    - title: Sébastien V. - Portfolio
      description: Mon portfolio de développeur FullStack Nuxt.js & TypeScript
      detailed_description: |
        Un portfolio sur mesure, moderne et responsive, conçu pour valoriser mes compétences techniques, mes réalisations et mon expertise sur la création d'interfaces à haute valeur ajoutée.

        Développé avec Nuxt.js et TypeScript, l'application s'appuie sur Tailwind CSS pour le design et sur Framer Motion pour des animations interactives et fluides. La plateforme intègre une internationalisation complète (FR / EN / ES) via i18n.

        Ce projet illustre ma démarche rigoureuse : concevoir des expériences web rapides, ergonomiques et scalables, tout en proposant une vitrine claire pour l'ensemble de mes accomplissements.
      key_features:
        title: Fonctionnalités clés
        features:
          - Présenter mes projets, parcours et compétences
          - Proposer une expérience trilingue (FR / EN / ES)
          - Découvrir les projets avec démos interactives et dépôts GitHub
      github_button: 
        label: GitHub
        to: https://github.com/SVILLEBRUN/sv-portfolio
      demo_button:
        label: Démo
        to: https://sebastien-villebrun.com
      is_current_site: true
      image: /projects/portfolio.png
      main_stack: [ Nuxt.js, Typescript, i18n ]
      stack:
        - title: Nuxt.js
          logo: /tools_logo/nuxt_js.png
        - title: Typescript
          logo: /tools_logo/typescript.png
        - title: Tailwind
          logo: /tools_logo/tailwind_css.png
        - title: i18n
          logo: /tools_logo/i18n.png
        - title: Framer Motion
          logo: /tools_logo/framer_motion.png
    - title: Academint
      description: Plateforme de certifications de formation vérifiables via la blockchain
      detailed_description: |
        Une plateforme web innovante permettant aux organismes et établissements de formation de délivrer des certificats numériques sécurisés, infalsifiables et immédiatement vérifiables sur la blockchain.

        Les étudiants peuvent centraliser et valoriser leurs diplômes, tandis que les recruteurs vérifient leur authenticité en un clic et en toute transparence.

        Développé en deux semaines lors du bootcamp Le Wagon avec Ruby on Rails et l'intégration d'API Web3.
      key_features:
        title: Fonctionnalités clés
        features:
          - Émettre des diplômes infalsifiables sur la blockchain
          - Vérifier instantanément l'authenticité d'un certificat
          - Consulter et partager ses certifications
          - Garantir la valeur et l'immuabilité des titres délivrés
      github_button: 
        label: GitHub
        to: https://github.com/SVILLEBRUN/Academint
      demo_button:
        label: Démo
        to: https://sebastien-villebrun.com/academint/
      image: /projects/academint.png
      main_stack: [ Ruby on Rails, PostgreSQL, Web3 ]
      stack:
        - title: Ruby on Rails
          logo: /tools_logo/ruby_on_rails.png
        - title: PostgreSQL
          logo: /tools_logo/postgreSQL.png
        - title: HTML
          logo: /tools_logo/html.png
        - title: CSS
          logo: /tools_logo/css.png
        - title: Javascript
          logo: /tools_logo/javascript.png
    - title: Airjewels
      description: Plateforme collaborative de location de bijoux haut de gamme
      detailed_description: |
        Une application web inspirée du modèle d'Airbnb, dédiée à la location, la réservation et la mise en valeur de bijoux entre particuliers.

        Les propriétaires peuvent publier leurs annonces, télécharger des visuels haute définition, géolocaliser leurs articles et gérer leur calendrier de disponibilité. Une messagerie temps-réel sécurisée facilite la prise de contact directe.

        Projet conçu et livré en équipe de 4 personnes sur un sprint de 4 jours au sein du bootcamp Le Wagon.
      key_features:
        title: Fonctionnalités clés
        features:
          - Publier et louer des bijoux entre particuliers
          - Géolocaliser les pièces disponibles à proximité
          - Réserver un bijou et gérer ses créneaux de location
          - Communiquer entre propriétaires et locataires via la messagerie
      github_button: 
        label: GitHub
        to: https://github.com/SVILLEBRUN/airjewels-rails
      demo_button:
        label: Démo
        to: https://sebastien-villebrun.com/airjewels-rails/
      image: /projects/airjewels.png
      main_stack: [ Ruby on Rails, PostgreSQL ]
      stack:
        - title: Ruby on Rails
          logo: /tools_logo/ruby_on_rails.png
        - title: PostgreSQL
          logo: /tools_logo/postgreSQL.png
        - title: HTML
          logo: /tools_logo/html.png
        - title: CSS
          logo: /tools_logo/css.png
        - title: Javascript
          logo: /tools_logo/javascript.png
    - title: Movie DB API
      description: API RESTful haute performance pour la gestion de données cinématographiques
      detailed_description: |
        Une API backend robuste et évolutive conçue pour centraliser, traiter et distribuer des volumes de données cinématographiques et métadonnées associées.

        Bâtie sur Node.js, Express et MongoDB, elle garantit des performances optimales pour alimenter tout type d'application client (web ou mobile) via des endpoints structurés et documentés.

        L'architecture intègre une stratégie de mise en cache, un indexage ciblé des bases de données et un système d'authentification renforcé via JSON Web Tokens (JWT).
      key_features:
        title: Fonctionnalités clés
        features:
          - Gérer le catalogue complet de films et leurs métadonnées (CRUD)
          - Sécuriser l'accès aux ressources par authentification JWT
          - Optimiser les temps de réponse via le caching et l'indexation sur la base de données
      # demo_button:
      #   label: Démo
      #   to: https://sebastien.villebrun.com/movie-db-app/api/movies
      github_button: 
        label: GitHub
        to: https://github.com/SVILLEBRUN/Movie_db_app
      image: /projects/movie_db_api.jpg
      main_stack: [ Express.js, MongoDB, JWT ]
      stack: 
        - title: Node.js
          logo: /tools_logo/node_js.png
        - title: Express.js
          logo: /tools_logo/express_js.png
        - title: MongoDB
          logo: /tools_logo/mongo_db.png
        - title: JWT
          logo: /tools_logo/jwt.png
        - title: Postman
          logo: /tools_logo/postman.png
