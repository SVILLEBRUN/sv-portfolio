projects:
  title: Featured Projects
  modal_title: Project Overview
  items:
    - title: Sébastien V. - Portfolio
      description: Full-Stack Developer Portfolio built with Nuxt.js & TypeScript
      detailed_description: |
        A modern, fully responsive portfolio built to showcase my skills, experience, and personal projects.

        Engineered with Nuxt.js and TypeScript, styled with Tailwind CSS, and enhanced with smooth animations powered by Framer Motion. The platform features full internationalization support for English, French, and Spanish via i18n.

        This project highlights my commitment to crafting clean, high-performance, and intuitive web experiences while providing a central hub for my work.
      key_features:
        title: Key Features
        features:
          - Showcase projects, professional background, and core technical skills
          - Trilingual user experience (EN / FR / ES)
          - Interactive project exploration with live demos and GitHub repositories
      # TODO: Change demo link
      github_button: 
        label: GitHub
        to: https://github.com/SVILLEBRUN/sv-portfolio
      demo_button:
        label: Live Demo
        to: https://sebastien.villebrun.com/
      is_current_site: true
      image: /projects/portfolio.png
      main_stack: [ Nuxt.js, Typescript, i18n ]
      stack:
        - title: Nuxt.js
          logo: /tools_logo/nuxt_js.png
        - title: Typescript
          logo: /tools_logo/typescript.png
        - title: Tailwind
          logo: /tools_logo/tailwind_css.png
        - title: i18n
          logo: /tools_logo/i18n.png
        - title: Framer Motion
          logo: /tools_logo/framer_motion.png
    - title: Academint
      description: Blockchain-verified credential and training platform
      detailed_description: |
        A web platform that enables educational institutions to issue secure, tamper-proof, and easily verifiable digital certificates using blockchain technology.

        Students can receive and showcase their credentials, while recruiters and organizations can instantly verify certificate authenticity.

        Built in two weeks as part of Le Wagon's intensive bootcamp using Ruby on Rails and Web3 APIs.
      key_features:
        title: Key Features
        features:
          - Issue tamper-proof diplomas on the blockchain
          - Verify certificate authenticity instantly
          - Manage, view, and share earned certifications
          - Ensure the immutability and long-term validity of issued credentials
      # TODO: Change demo link
      github_button: 
        label: GitHub
        to: https://github.com/SVILLEBRUN/Academint
      demo_button:
        label: Live Demo
        to: https://sebastien.villebrun.com/academint/
      image: /projects/academint.png
      main_stack: [ Ruby on Rails, PostgreSQL, Web3 ]
      stack:
        - title: Ruby on Rails
          logo: /tools_logo/ruby_on_rails.png
        - title: PostgreSQL
          logo: /tools_logo/postgreSQL.png
        - title: HTML
          logo: /tools_logo/html.png
        - title: CSS
          logo: /tools_logo/css.png
        - title: Javascript
          logo: /tools_logo/javascript.png
    - title: Airjewels
      description: Peer-to-peer jewelry rental platform inspired by Airbnb
      detailed_description: |
        An Airbnb-style web application designed for users to list, discover, and rent high-end jewelry.

        Users can create listings, upload photos, geolocate items nearby, and manage bookings. An in-app messaging system facilitates seamless communication between owners and renters.

        Developed in four days by a team of four developers during Le Wagon's bootcamp.
      key_features:
        title: Key Features
        features:
          - Peer-to-peer jewelry rental marketplace
          - Geolocation to find available pieces nearby
          - Booking management and availability scheduling
          - Direct messaging system between owners and renters
      # TODO: Change demo link
      github_button: 
        label: GitHub
        to: https://github.com/SVILLEBRUN/airjewels-rails
      demo_button:
        label: Live Demo
        to: https://sebastien.villebrun.com/airjewels-rails/
      image: /projects/airjewels.png
      main_stack: [ Ruby on Rails, PostgreSQL ]
      stack:
        - title: Ruby on Rails
          logo: /tools_logo/ruby_on_rails.png
        - title: PostgreSQL
          logo: /tools_logo/postgreSQL.png
        - title: HTML
          logo: /tools_logo/html.png
        - title: CSS
          logo: /tools_logo/css.png
        - title: Javascript
          logo: /tools_logo/javascript.png
    - title: Movie DB API
      description: High-performance RESTful API for movie data management
      detailed_description: |
        A flexible backend API engineered to centralize, organize, and manage movie data and metadata.

        Built with Node.js, Express, and MongoDB, it provides a robust foundation for frontend applications through fast and easy-to-integrate endpoints.

        Includes caching and indexing mechanisms to minimize response times, along with JWT authentication to protect private endpoints and resources.
      key_features:
        title: Key Features
        features:
          - Full CRUD operations for movie catalogs and metadata
          - Secure resource access with JWT-based authentication
          - Response time optimization through database caching and indexing
      # demo_button:
      #   label: Live Demo
      #   to: https://sebastien.villebrun.com/movie-db-app/api/movies
      github_button: 
        label: GitHub
        to: https://github.com/SVILLEBRUN/Movie_db_app
      image: /projects/movie_db_api.jpg
      main_stack: [ Express.js, MongoDB, JWT ]
      stack: 
        - title: Node.js
          logo: /tools_logo/node_js.png
        - title: Express.js
          logo: /tools_logo/express_js.png
        - title: MongoDB
          logo: /tools_logo/mongo_db.png
        - title: JWT
          logo: /tools_logo/jwt.png
        - title: Postman
          logo: /tools_logo/postman.png
