projects:
  title: Mis proyectos
  modal_title: Detalles del proyecto 
  items:
    - title: Sébastien V. - Portafolio
      description: Mi portafolio de desarrollador FullStack Nuxt.js & TypeScript
      detailed_description: |
        Un portafolio a medida, moderno y responsive, concebido para poner en valor mis competencias técnicas, mis proyectos y mi experiencia en el desarrollo de interfaces de alto valor añadido.

        Desarrollada con Nuxt.js y TypeScript, la aplicación utiliza Tailwind CSS para el diseño visual y Framer Motion para lograr animaciones fluidas e interactivas. Cuenta además con soporte multilingüe completo (FR / EN / ES) gestionado mediante i18n.

        Este proyecto refleja mi enfoque de trabajo: construir experiencias web rápidas, ergonómicas y escalables, ofreciendo al mismo tiempo una carta de presentación clara de todos mis trabajos.
      key_features:
        title: Funcionalidades clave
        features:
          - Presentar mis proyectos, trayectoria y habilidades técnicas
          - Ofrecer una experiencia de navegación trilingüe (FR / EN / ES)
          - Explorar proyectos mediante demos interactivas y repositorios de GitHub
      # TODO: Change demo link
      github_button: 
        label: GitHub
        to: https://github.com/SVILLEBRUN/sv-portfolio
      demo_button:
        label: Demo
        to: https://sebastien.villebrun.com/
      is_current_site: true
      image: /projects/portfolio.png
      main_stack: [ Nuxt.js, Typescript, i18n ]
      stack:
        - title: Nuxt.js
          logo: /tools_logo/nuxt_js.png
        - title: Typescript
          logo: /tools_logo/typescript.png
        - title: Tailwind
          logo: /tools_logo/tailwind_css.png
        - title: i18n
          logo: /tools_logo/i18n.png
        - title: Framer Motion
          logo: /tools_logo/framer_motion.png
    - title: Academint
      description: Plataforma de certificación académica verificable mediante blockchain
      detailed_description: |
        Una innovadora plataforma web que permite a instituciones educativas y centros de formación emitir certificados digitales seguros, infalsificables y verificables al instante en la blockchain.

        Los estudiantes pueden centralizar y dar visibilidad a sus acreditaciones, mientras que los reclutadores pueden comprobar su autenticidad con un solo clic y de forma transparente.

        Desarrollado en un plazo de dos semanas durante el bootcamp Le Wagon con Ruby on Rails e integración de APIs Web3.
      key_features:
        title: Funcionalidades clave
        features:
          - Emitir certificados infalsificables integrados en blockchain
          - Verificar de forma instantánea la autenticidad de cada título
          - Consultar y compartir certificaciones de manera sencilla
          - Garantizar la validez e inmutabilidad de los diplomas expedidos
      # TODO: Change demo link
      github_button: 
        label: GitHub
        to: https://github.com/SVILLEBRUN/Academint
      demo_button:
        label: Demo
        to: https://sebastien.villebrun.com/academint/
      image: /projects/academint.png
      main_stack: [ Ruby on Rails, PostgreSQL, Web3 ]
      stack:
        - title: Ruby on Rails
          logo: /tools_logo/ruby_on_rails.png
        - title: PostgreSQL
          logo: /tools_logo/postgreSQL.png
        - title: HTML
          logo: /tools_logo/html.png
        - title: CSS
          logo: /tools_logo/css.png
        - title: Javascript
          logo: /tools_logo/javascript.png
    - title: Airjewels
      description: Plataforma colaborativa para el alquiler de joyas de alta gama
      detailed_description: |
        Una aplicación web inspirada en el modelo de marketplace de Airbnb, orientada al alquiler, reserva y gestión de joyas de lujo entre particulares.

        Los propietarios pueden publicar anuncios, subir imágenes en alta definición, geolocalizar sus artículos y gestionar su disponibilidad en tiempo real. Un sistema de mensajería privada garantiza un contacto fluido y directo entre las partes.

        Proyecto diseñado y desarrollado en equipo (4 integrantes) durante un sprint de 4 días en el bootcamp Le Wagon.
      key_features:
        title: Funcionalidades clave
        features:
          - Publicar y alquilar joyas de lujo entre particulares
          - Geolocalizar piezas disponibles en zonas cercanas
          - Reservar joyas y gestionar calendarios de alquiler
          - Comunicación en tiempo real entre propietarios e inquilinos
      # TODO: Change demo link
      github_button: 
        label: GitHub
        to: https://github.com/SVILLEBRUN/airjewels-rails
      demo_button:
        label: Demo
        to: https://sebastien.villebrun.com/airjewels-rails/
      image: /projects/airjewels.png
      main_stack: [ Ruby on Rails, PostgreSQL ]
      stack:
        - title: Ruby on Rails
          logo: /tools_logo/ruby_on_rails.png
        - title: PostgreSQL
          logo: /tools_logo/postgreSQL.png
        - title: HTML
          logo: /tools_logo/html.png
        - title: CSS
          logo: /tools_logo/css.png
        - title: Javascript
          logo: /tools_logo/javascript.png
    - title: Movie DB API
      description: API RESTful de alto rendimiento para la gestión de datos cinematográficos
      detailed_description: |
        Una API backend robusta y escalable concebida para centralizar, procesar y distribuir volúmenes de datos cinematográficos y sus metadatos asociados.

        Desarrollada sobre Node.js, Express y MongoDB, garantiza tiempos de respuesta óptimos para nutrir aplicaciones cliente (web o móviles) a través de endpoints estructurados y bien documentados.

        Su arquitectura incluye mecanismos de caché, indexación avanzada en base de datos y un sistema de autenticación seguro mediante JSON Web Tokens (JWT).
      key_features:
        title: Funcionalidades clave
        features:
          - Gestión completa del catálogo de películas y metadatos (operaciones CRUD)
          - Autenticación y acceso seguro a recursos mediante tokens JWT
          - Optimización del rendimiento mediante caché e indexación de consultas
      # demo_button:
      #   label: Démo
      #   to: https://sebastien.villebrun.com/movie-db-app/api/movies
      github_button: 
        label: GitHub
        to: https://github.com/SVILLEBRUN/Movie_db_app
      image: /projects/movie_db_api.jpg
      main_stack: [ Express.js, MongoDB, JWT ]
      stack: 
        - title: Node.js
          logo: /tools_logo/node_js.png
        - title: Express.js
          logo: /tools_logo/express_js.png
        - title: MongoDB
          logo: /tools_logo/mongo_db.png
        - title: JWT
          logo: /tools_logo/jwt.png
        - title: Postman
          logo: /tools_logo/postman.png
