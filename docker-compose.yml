services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: 'development-stage'
    container_name: sv-portfolio
    ports:
      - "8081:8081"
      - "24678:24678"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
    environment:
      - HOST=0.0.0.0
      - PORT=8081
      - WATCHPACK_POLLING=true